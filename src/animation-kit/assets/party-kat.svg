<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Party kat">
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="1.8s" repeatCount="indefinite"/>
    <!-- party hat -->
    <path d="M100 6 L128 62 L72 62 Z" fill="#b0a1e3"/>
    <path d="M100 6 L128 62 L72 62 Z" fill="url(#ph-stripes)" opacity="0.35"/>
    <circle cx="100" cy="6" r="7" fill="#f3b53f"/>
    <g fill="#fff3e0">
      <circle cx="88" cy="52" r="3"/>
      <circle cx="108" cy="44" r="3"/>
      <circle cx="98" cy="34" r="3"/>
    </g>
    <defs>
      <linearGradient id="ph-stripes" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff9f7e"/>
        <stop offset="1" stop-color="#7fb185"/>
      </linearGradient>
    </defs>
    <!-- body -->
    <ellipse cx="100" cy="150" rx="50" ry="38" fill="#ffb59a"/>
    <!-- head -->
    <circle cx="100" cy="104" r="44" fill="#ffc4ac"/>
    <!-- ears -->
    <path d="M66 76 L60 46 L92 68 Z" fill="#ffb59a"/>
    <path d="M134 76 L140 46 L108 68 Z" fill="#ffb59a"/>
    <path d="M70 72 L68 56 L84 68 Z" fill="#f6c6ce"/>
    <path d="M130 72 L132 56 L116 68 Z" fill="#f6c6ce"/>
    <!-- cheeks -->
    <circle cx="74" cy="114" r="9" fill="#f6a9b4" opacity="0.75"/>
    <circle cx="126" cy="114" r="9" fill="#f6a9b4" opacity="0.75"/>
    <!-- happy closed eyes ^ ^ -->
    <path d="M76 102 q6 -8 12 0" fill="none" stroke="#5f4a39" stroke-width="3" stroke-linecap="round"/>
    <path d="M112 102 q6 -8 12 0" fill="none" stroke="#5f4a39" stroke-width="3" stroke-linecap="round"/>
    <!-- nose + big smile -->
    <path d="M96 112 L104 112 L100 117 Z" fill="#e07a86"/>
    <path d="M82 120 q18 18 36 0" fill="none" stroke="#5f4a39" stroke-width="3" stroke-linecap="round"/>
    <!-- whiskers -->
    <g stroke="#c9a892" stroke-width="2" stroke-linecap="round">
      <path d="M56 110 L36 106 M56 118 L36 120 M144 110 L164 106 M144 118 L164 120"/>
    </g>
  </g>
</svg>
