<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Relay bot">
  <defs>
    <linearGradient id="rb-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12204a"/>
      <stop offset="1" stop-color="#0a1330"/>
    </linearGradient>
    <radialGradient id="rb-eye" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#bffaff"/>
      <stop offset="1" stop-color="#22e6ff"/>
    </radialGradient>
  </defs>
  <!-- antenna -->
  <line x1="100" y1="44" x2="100" y2="20" stroke="#22e6ff" stroke-width="3"/>
  <circle cx="100" cy="16" r="7" fill="#ff2bd6">
    <animate attributeName="r" values="6;8;6" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <!-- head -->
  <rect x="46" y="44" width="108" height="92" rx="22" fill="url(#rb-body)" stroke="#22e6ff" stroke-width="3"/>
  <!-- side ears -->
  <rect x="38" y="76" width="10" height="28" rx="4" fill="#0a1330" stroke="#22e6ff" stroke-width="2"/>
  <rect x="152" y="76" width="10" height="28" rx="4" fill="#0a1330" stroke="#22e6ff" stroke-width="2"/>
  <!-- eyes -->
  <circle cx="78" cy="86" r="12" fill="url(#rb-eye)">
    <animate attributeName="ry" values="12;2;12" dur="4s" keyTimes="0;0.06;0.12;1" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="122" cy="86" r="12" fill="url(#rb-eye)"/>
  <!-- mouth -->
  <path d="M78 112 q22 16 44 0" fill="none" stroke="#39ff14" stroke-width="4" stroke-linecap="round"/>
  <!-- glow cheeks -->
  <circle cx="64" cy="106" r="5" fill="#ff2bd6" fill-opacity="0.55"/>
  <circle cx="136" cy="106" r="5" fill="#ff2bd6" fill-opacity="0.55"/>
  <!-- body base -->
  <rect x="70" y="140" width="60" height="26" rx="10" fill="url(#rb-body)" stroke="#22e6ff" stroke-width="3"/>
  <circle cx="88" cy="153" r="3" fill="#22e6ff"/>
  <circle cx="100" cy="153" r="3" fill="#ff2bd6"/>
  <circle cx="112" cy="153" r="3" fill="#39ff14"/>
</svg>
