<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Book friend">
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="3.6s" repeatCount="indefinite"/>
    <!-- back cover -->
    <rect x="40" y="52" width="120" height="104" rx="12" fill="#b0a1e3"/>
    <!-- pages -->
    <rect x="52" y="60" width="96" height="90" rx="6" fill="#fff7ea"/>
    <!-- spine crease -->
    <path d="M100 60 L100 150" stroke="#e8d3b8" stroke-width="3" stroke-dasharray="4 5"/>
    <!-- text lines -->
    <g stroke="#e0d3c2" stroke-width="3" stroke-linecap="round">
      <path d="M62 78 L92 78 M62 90 L90 90 M108 78 L138 78 M108 90 L136 90"/>
    </g>
    <!-- cheeks -->
    <circle cx="74" cy="120" r="8" fill="#f6a9b4" opacity="0.7"/>
    <circle cx="126" cy="120" r="8" fill="#f6a9b4" opacity="0.7"/>
    <!-- eyes -->
    <circle cx="82" cy="112" r="6.5" fill="#5f4a39">
      <animate attributeName="ry" values="6.5;1;6.5" dur="5s" keyTimes="0;0.03;0.07;1" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <circle cx="118" cy="112" r="6.5" fill="#5f4a39">
      <animate attributeName="ry" values="6.5;1;6.5" dur="5s" keyTimes="0;0.03;0.07;1" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <circle cx="84" cy="110" r="1.8" fill="#fff"/>
    <circle cx="120" cy="110" r="1.8" fill="#fff"/>
    <!-- smile -->
    <path d="M88 128 q12 12 24 0" fill="none" stroke="#5f4a39" stroke-width="3" stroke-linecap="round"/>
    <!-- bookmark ribbon -->
    <path d="M132 52 L132 84 L124 76 L116 84 L116 52 Z" fill="#ff9f7e"/>
    <!-- little sparkle -->
    <path d="M150 44 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#f3b53f">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
