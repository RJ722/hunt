<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Page sprite">
  <defs>
    <linearGradient id="pg-cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1152"/>
      <stop offset="1" stop-color="#12093a"/>
    </linearGradient>
  </defs>
  <!-- floating book -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="3s" repeatCount="indefinite"/>
    <!-- pages -->
    <path d="M40 60 q60 -18 120 0 v96 q-60 -18 -120 0 Z" fill="#0a1330" stroke="#a855f7" stroke-width="3"/>
    <path d="M100 51 v105" stroke="#a855f7" stroke-width="3"/>
    <!-- cover glow -->
    <path d="M40 60 q60 -18 120 0" fill="none" stroke="#ff2bd6" stroke-width="2"/>
    <!-- text lines -->
    <line x1="58" y1="82" x2="90" y2="76" stroke="#22e6ff" stroke-width="3" stroke-linecap="round"/>
    <line x1="58" y1="98" x2="88" y2="93" stroke="#22e6ff" stroke-width="3" stroke-linecap="round"/>
    <line x1="58" y1="114" x2="86" y2="110" stroke="#22e6ff" stroke-width="3" stroke-linecap="round"/>
    <line x1="112" y1="76" x2="144" y2="82" stroke="#22e6ff" stroke-width="3" stroke-linecap="round"/>
    <line x1="114" y1="93" x2="142" y2="98" stroke="#22e6ff" stroke-width="3" stroke-linecap="round"/>
    <!-- little face on the spine -->
    <circle cx="90" cy="118" r="4" fill="#39ff14"/>
    <circle cx="110" cy="118" r="4" fill="#39ff14"/>
    <path d="M92 130 q8 8 16 0" fill="none" stroke="#39ff14" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- sparkle -->
  <g fill="#ffb300">
    <path d="M165 55 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z">
      <animate attributeName="fill-opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
