<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Signal orb">
  <defs>
    <radialGradient id="or-core" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#bffaff"/>
      <stop offset="1" stop-color="#22e6ff"/>
    </radialGradient>
  </defs>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="3.2s" repeatCount="indefinite"/>
    <!-- orbit rings -->
    <ellipse cx="100" cy="100" rx="70" ry="26" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.6"/>
    <ellipse cx="100" cy="100" rx="26" ry="70" fill="none" stroke="#ff2bd6" stroke-width="2" stroke-opacity="0.6"/>
    <!-- core -->
    <circle cx="100" cy="100" r="40" fill="url(#or-core)"/>
    <circle cx="100" cy="100" r="40" fill="none" stroke="#bffaff" stroke-width="2">
      <animate attributeName="r" values="38;44;38" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.8;0.2;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- face -->
    <circle cx="88" cy="96" r="5" fill="#0a1330"/>
    <circle cx="112" cy="96" r="5" fill="#0a1330"/>
    <path d="M86 110 q14 10 28 0" fill="none" stroke="#0a1330" stroke-width="4" stroke-linecap="round"/>
    <!-- orbiting dot -->
    <circle cx="170" cy="100" r="6" fill="#39ff14">
      <animateMotion dur="4s" repeatCount="indefinite" path="M0 0 a70 26 0 1 1 0 0.1 Z"/>
    </circle>
  </g>
</svg>
